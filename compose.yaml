services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ECOMMERCE_DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?Set MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      ECOMMERCE_DB_USERNAME: ${ECOMMERCE_DB_USERNAME:?Set ECOMMERCE_DB_USERNAME}
      ECOMMERCE_DB_PASSWORD: ${ECOMMERCE_DB_PASSWORD:?Set ECOMMERCE_DB_PASSWORD}
      ECOMMERCE_REDIS_HOST: redis
      ECOMMERCE_REDIS_PORT: 6379
      ECOMMERCE_RABBITMQ_HOST: rabbitmq
      ECOMMERCE_RABBITMQ_PORT: 5672
      ECOMMERCE_RABBITMQ_USER: ${ECOMMERCE_RABBITMQ_USER:?Set ECOMMERCE_RABBITMQ_USER}
      ECOMMERCE_RABBITMQ_PASSWORD: ${ECOMMERCE_RABBITMQ_PASSWORD:?Set ECOMMERCE_RABBITMQ_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce_network

  mysql:
    image: mysql:8.4
    container_name: ecommerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${ECOMMERCE_DB_USERNAME:?Set ECOMMERCE_DB_USERNAME}
      MYSQL_PASSWORD: ${ECOMMERCE_DB_PASSWORD:?Set ECOMMERCE_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:?Set MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce_network

  redis:
    image: redis:7.4-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "${ECOMMERCE_REDIS_PORT:?Set ECOMMERCE_REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ecommerce-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${ECOMMERCE_RABBITMQ_USER:?Set ECOMMERCE_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${ECOMMERCE_RABBITMQ_PASSWORD:?Set ECOMMERCE_RABBITMQ_PASSWORD}
    ports:
      - "${ECOMMERCE_RABBITMQ_PORT:?Set ECOMMERCE_RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:?Set RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce_network

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  ecommerce_network:
    driver: bridge
