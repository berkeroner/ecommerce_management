spring.application.name=ecommerce_management

# MySQL
spring.datasource.url=${ECOMMERCE_DB_URL:jdbc:mysql://localhost:3307/ecommerce_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${ECOMMERCE_DB_USERNAME:ecommerce}
spring.datasource.password=${ECOMMERCE_DB_PASSWORD:ecommerce_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Redis
spring.data.redis.host=${ECOMMERCE_REDIS_HOST:localhost}
spring.data.redis.port=${ECOMMERCE_REDIS_PORT:6379}

# RabbitMQ
spring.rabbitmq.host=${ECOMMERCE_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${ECOMMERCE_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${ECOMMERCE_RABBITMQ_USER:ecommerce}
spring.rabbitmq.password=${ECOMMERCE_RABBITMQ_PASSWORD:ecommerce_password}

# Public API contract
logging.pattern.level=%5p [correlation_id=%X{correlation_id:-}]

# OpenAPI / Swagger UI
springdoc.paths-to-match=/api/v1/**
springdoc.swagger-ui.path=/swagger-ui.html
